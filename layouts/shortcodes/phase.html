{{/*  layouts/shortcodes/phase.html  */}}

<div class="tl-item">
  <div class="tl-icon">
    {{ with .Get "icon" }}
      <!-- user supplied an icon -->
      <img src="{{ . }}" alt="{{ $.Get "abbr" }}" />
    {{ else }}
      <!-- fallback: show the abbreviation text -->
      <span style="font-size:0.75rem; font-weight:700;">
        {{ .Get "abbr" }}
      </span>
    {{ end }}
  </div>

  <div class="tl-content">
    <h3>{{ .Get "title" }}</h3>
    <span class="tl-date">{{ .Get "date" }}</span>
    {{ .Inner | markdownify }}
  </div>
</div>
