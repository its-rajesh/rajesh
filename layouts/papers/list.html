{{- define "main" }}
<main class="papers-section-only">
  {{- if .Content }}
  <div class="post-content papers-content">
    {{- if not (.Param "disableAnchoredHeadings") }}

    {{- else }}{{ .Content }}{{ end }}
  </div>
  {{- end }}
</main>
{{- end }}
