<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DBSS Demo</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="wrap">
    <div class="spec-wrap">
      <div class="spec-stack">
        <img id="specBase" alt="spectrogram"/>
        <img id="specMask" alt="mask overlay"/>
      </div>
      <div class="row">
        <label>Distance τ: <span id="tauVal">--</span> m</label>
        <input id="tau" type="range" min="0" max="6" step="0.5" value="2"/>
      </div>
      <div class="hint">Green overlay = TF bins dominated by sources with d ≤ τ</div>
    </div>
    <div class="audio-wrap">
      <div class="audio-card">
        <div class="a-label">Mixture (mic-0)</div>
        <audio id="mixAudio" controls></audio>
      </div>
      <div class="audio-card">
        <div class="a-label">Distance-selected (d ≤ τ)</div>
        <audio id="nearAudio" controls></audio>
      </div>
    </div>
    <div id="status" class="status">loading…</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
